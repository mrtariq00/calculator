<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="calculater">
            <div class="display">
                <div id="equBox"></div>
                <div id="resBox"></div>
            </div>
            <div class="keypad">
                <button onclick="calculater('C')">C</button>
                <button onclick="calculater('del')">Del</button>
                <button id="yellow-btn" onclick="calculater('%')">%</button>
                <button id="yellow-btn" onclick="calculater('÷')">÷</button> 
                <button onclick="calculater('1')">1</button>
                <button onclick="calculater('2')">2</button>
                <button onclick="calculater('3')">3</button>
                <button id="yellow-btn" onclick="calculater('×')">×</button> 
                <button onclick="calculater('4')">4</button>
                <button onclick="calculater('5')">5</button>
                <button onclick="calculater('6')">6</button>
                <button id="yellow-btn" onclick="calculater('-')">-</button> 
                <button onclick="calculater('1')">1</button>
                <button onclick="calculater('2')">2</button>
                <button onclick="calculater('3')">3</button>
                <button id="yellow-btn" onclick="calculater('+')">+</button> 
                <button onclick="calculater('0')">0</button>
                <button onclick="calculater('00')">00</button>
                <button onclick="calculater('.')">.</button>
                <button id="yellow-btn" onclick="calculater('=')">=</button> 
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
